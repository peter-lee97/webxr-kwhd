name: webxr

services:
  app:
    image: webxr-kwhd:latest
    pull_policy: never
    ports:
      - "127.0.0.1:4100:3000"
    env_file:
      - .env
    volumes:
      - ./captures:/app/captures
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
